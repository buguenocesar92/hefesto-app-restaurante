# ---------------------------------------------------------------------------
# Servidor web interno de la API.
# ---------------------------------------------------------------------------
# No es el servidor publico: es el que hace de puente entre php-fpm y el
# contenedor web (BFF). El servidor publico es Caddy.
# ---------------------------------------------------------------------------

server {
    listen 8080;
    server_name _;

    root /var/www/html/public;

    # El index.php es el unico punto de entrada. Nada fuera de `public/` es
    # accesible: sin esta linea, un contenedor mal configurado serviria el
    # archivo .env entero.
    index index.php;

    client_max_body_size 2m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Comprobacion de salud para el orquestador. Es la unica ruta que se
    # responde sin pasar por PHP.
    location = /nginx-salud {
        access_log off;
        return 200 "ok\n";
    }
}