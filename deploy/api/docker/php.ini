; Configuracion de PHP para la API de restaurante.
; Los valores que importan son los de zona horaria y los de limites de memoria.

[PHP]
; El restaurante opera en hora local. Sin esto, un pedido de las 21:00 se
; guardaria con la hora de otro pais y el tiempo en pantalla de cocina seria
; incorrecto.
date.timezone = America/Santiago

memory_limit = 256M
max_execution_time = 30

; En produccion los errores no se muestran al navegador: se registran y se
; devuelven como mensaje generico. Ver bootstrap/app.php.
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Limite de peticiones de cuerpo: las comandas son chicas. Un limite alto
; permite que alguien llene la memoria del servidor con una sola peticion.
post_max_size = 2M
upload_max_filesize = 2M

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0

; Sesion: el tiempo de vida por omision son dos semanas. Una sesion de mesero
; que sobrevive a un reinicio del local no es una sesion, es una credencial
; abandonada. El valor real se fija con la variable de entorno de Laravel.
session.cookie_httponly = 1
session.cookie_samesite = Lax

; La API nunca se expone al navegador en produccion (ver compose.prod.yml), pero
; si quedara expuesta por error, este ajuste evita que PHP muestre su pagina de
; estado con la version exacta instalada.
expose_php = Off