; ---------------------------------------------------------------------------
; Procesos del contenedor de la API.
; ---------------------------------------------------------------------------
; php-fpm y nginx en el mismo contenedor: es lo mas simple para una API de este
; tamano y evita tener que coordinar dos contenedores para una comprobacion de
; salud.
; ---------------------------------------------------------------------------

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0