# ---------------------------------------------------------------------------
# Restaurante: entorno de PRODUCCION
# ---------------------------------------------------------------------------
#
# Uso:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d
#
# Solo `proxy` publica puertos. Para los dos roles de la base, mira el
# bloque de PostgreSQL mas abajo. Ver docs/03.
# ---------------------------------------------------------------------------

name: restaurante

services:
  # -------------------------------------------------------------------------
  # Caddy: unico servicio con puerto publico. Termina TLS y reparte.
  # -------------------------------------------------------------------------
  proxy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-datos:/data
      - caddy-configuracion:/config

  # -------------------------------------------------------------------------
  # PostgreSQL.
  #
  # DOS ROLES, Y NO UNO
  # -------------------
  # `POSTGRES_USER` es el rol de ARRANQUE: la imagen oficial ejecuta
  # `initdb --username="$POSTGRES_USER"` y ese rol nace superusuario. Solo
  # se usa para crear la base y para las tareas administrativas. La
  # aplicacion NUNCA conecta con el.
  #
  # El rol de la aplicacion (`DB_USERNAME`) lo crea
  # `deploy/postgres/inicializar-rol.sh` al inicializar el volumen, con
  # NOSUPERUSER y NOBYPASSRLS explicitos. Le da la propiedad de la base
  # para que las migraciones de Laravel puedan crear el esquema.
  #
  # POR QUE IMPORTA: la documentacion de PostgreSQL 18 dice que los
  # superusuarios "always bypass the row security system", y que
  # `FORCE ROW LEVEL SECURITY` sujeta solo al DUENO de la tabla, no al
  # superusuario. Con un solo rol las politicas no se aplicarian y el
  # aislamiento entre empresas seria decorativo. Ver docs/03.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?falta DB_DATABASE en el .env}
      POSTGRES_USER: ${DB_ADMIN_USERNAME:-restaurante_admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?falta DB_ADMIN_PASSWORD en el .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # Rol con el que conecta la aplicacion. Lo crea el script de arranque.
      APP_DB_ROLE: ${DB_USERNAME:-restaurante_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el .env}
    volumes:
      - postgres-datos:/var/lib/postgresql/data
      - ./postgres/inicializar-rol.sh:/docker-entrypoint-initdb.d/inicializar-rol.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-restaurante_app} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sin `ports`: no es alcanzable desde fuera de la red de Docker.

  redis:
    image: redis:8.8.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:?falta REDIS_PASSWORD en el .env}"]
    volumes:
      - redis-datos:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: restaurante-api:${APP_VERSION:-0.1.0}
    build:
      context: ../api
      dockerfile: ../deploy/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: "Aplicacion de restaurante"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?falta APP_KEY en el .env}
      APP_URL: ${APP_URL:?falta APP_URL en el .env}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      SESSION_SECURE_COOKIE: "true"

      COCINA_INTERVALO_REFRESCO_MS: ${COCINA_INTERVALO_REFRESCO_MS:-3000}

      # En produccion las migraciones se corren a mano. Ver cabecera.
      CORRER_MIGRACIONES: "false"
    # El codigo va en la imagen. Aqui no hay volumen de codigo.

  cola:
    image: restaurante-api:${APP_VERSION:-0.1.0}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis

  scheduler:
    image: restaurante-api:${APP_VERSION:-0.1.0}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    # Reconstruye el reloj de cocina y verifica el aislamiento, segun
    # routes/console.php.
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis

  web:
    image: restaurante-web:${APP_VERSION:-0.1.0}
    build:
      context: ../web
      dockerfile: ../deploy/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NUXT_API_BASE: http://api:8080
      NUXT_PUBLIC_BASE: ${APP_WEB_URL:?falta APP_WEB_URL en el .env}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?falta NUXT_SESSION_PASSWORD en el .env}
      NUXT_AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:?falta AUTHENTIK_ISSUER en el .env}
      NUXT_AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:?falta AUTHENTIK_CLIENT_ID en el .env}
      NUXT_AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:?falta AUTHENTIK_CLIENT_SECRET en el .env}
      NUXT_AUTHENTIK_REDIRECT_URI: ${AUTHENTIK_REDIRECT_URI:?falta AUTHENTIK_REDIRECT_URI en el .env}
      NUXT_AUTHENTIK_GRUPO_ADMIN: ${AUTHENTIK_GRUPO_ADMIN:-restaurante-administradores}
      NUXT_INTERVALO_COCINA_MS: ${COCINA_INTERVALO_REFRESCO_MS:-3000}

  # -------------------------------------------------------------------------
  # Authentik va en su propia instalacion (su base, su dominio y su ciclo de
  # vida). No se incluye aqui a proposito: si Authentik se cae y arrastra a esta
  # aplicacion, ningun mesero puede cobrar.
  #
  # Se instala con el kit "Hefesto Identidad" y se comparte entre clientes de
  # Hefesto. Ver docs/04-INSTALACION.md.
  # -------------------------------------------------------------------------

volumes:
  postgres-datos:
  redis-datos:
  caddy-datos:
  caddy-configuracion: